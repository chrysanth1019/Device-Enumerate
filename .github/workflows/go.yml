name: Go Multi-OS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            go build -o enumerator.exe
          else
            go build -o enumerator
          fi
        shell: bash

      - name: Test
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./enumerator.exe
          else
            ./enumerator
          fi
        shell: bash