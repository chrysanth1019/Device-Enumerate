name: Release with Binaries (32-bit and 64-bit)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        goarch: [amd64, 386]  # Build for both 64-bit (amd64) and 32-bit (386)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Build the binary for ${{ matrix.os }} and ${{ matrix.goarch }}
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            GOOS=windows GOARCH=${{ matrix.goarch }} go build -o enumerator-${{ matrix.goarch }}.exe
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            GOOS=darwin GOARCH=${{ matrix.goarch }} go build -o enumerator-${{ matrix.goarch }}
          else
            GOOS=linux GOARCH=${{ matrix.goarch }} go build -o enumerator-${{ matrix.goarch }}
          fi

      - name: Move the binary files
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv enumerator-${{ matrix.goarch }}.exe enumerator-windows-${{ matrix.goarch }}.exe
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            mv enumerator-${{ matrix.goarch }} enumerator-darwin-${{ matrix.goarch }}
          else
            mv enumerator-${{ matrix.goarch }} enumerator-linux-${{ matrix.goarch }}
          fi

      - name: Archive the binaries
        run: |
          mkdir release
          mv enumerator-linux-* release/
          mv enumerator-windows-* release/
          mv enumerator-darwin-* release/
          cd release
          zip -r release-binaries.zip *

      - name: Upload release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/release-binaries.zip
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
