name: Release with Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Build the binary for ${{ matrix.os }}
        run: |
          echo "Listing files before build:"
          ls -al
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            GOOS=windows GOARCH=amd64 go build -o enumerator.exe
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            GOOS=darwin GOARCH=amd64 go build -o enumerator
          else
            GOOS=linux GOARCH=amd64 go build -o enumerator
          fi

          echo "Listing files after build:"
          ls -al

      - name: Move the binary files
        run: |
          echo "Listing files before moving:"
          ls -al
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv enumerator.exe enumerator-windows.exe
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            mv enumerator enumerator-darwin
          else
            mv enumerator enumerator-linux
          fi

          echo "Listing files after moving:"
          ls -al

      - name: Archive the binaries
        run: |
          mkdir release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv enumerator-windows.exe release/
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            mv enumerator-darwin release/
          else
            mv enumerator-linux release/
          fi
          cd release
          zip -r release-binaries.zip *

      - name: Debug GitHub Ref and Release Check
        run: |
          echo "GitHub Ref: $GITHUB_REF"
          echo "Is this a tag? ${{ startsWith(github.ref, 'refs/tags/') }}"

      - name: Upload release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/release-binaries.zip
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
