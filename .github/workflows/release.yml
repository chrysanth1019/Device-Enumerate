name: Release with Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Build binary
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GOOS=windows GOARCH=amd64 go build -o enumerator-windows.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            GOOS=darwin GOARCH=amd64 go build -o enumerator-darwin
          else
            GOOS=linux GOARCH=amd64 go build -o enumerator-linux
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-binary
          path: |
            enumerator-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: ls -R artifacts

      - name: Zip all binaries
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          zip -r release-binaries.zip *

      - name: Upload release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: release/release-binaries.zip
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
