name: Release with Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.goos }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: enumerator-linux
            runner: ubuntu-latest

          - goos: windows
            goarch: amd64
            output_name: enumerator-windows.exe
            runner: windows-latest

          - goos: darwin
            goarch: amd64
            output_name: enumerator-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Build binary
        shell: bash
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ${{ matrix.output_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: ls -R artifacts

      - name: Zip all binaries
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          zip -r release-binaries.zip *

      - name: Upload release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: release/release-binaries.zip
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
