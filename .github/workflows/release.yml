name: Release with Binaries (32-bit and 64-bit)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64]  # 64-bit (amd64) only for macOS
        # For Windows and Linux, you can still include both 32-bit (386) and 64-bit (amd64)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Build the binary for ${{ matrix.os }} and ${{ matrix.arch }}
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            GOOS=windows GOARCH=${{ matrix.arch }} go build -o enumerator-${{ matrix.arch }}.exe
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            GOOS=darwin GOARCH=${{ matrix.arch }} go build -o enumerator-${{ matrix.arch }}
          else
            GOOS=linux GOARCH=${{ matrix.arch }} go build -o enumerator-${{ matrix.arch }}
          fi

      - name: Archive the binary
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv enumerator-${{ matrix.arch }}.exe enumerator-${{ matrix.os }}-${{ matrix.arch }}.exe
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            mv enumerator-${{ matrix.arch }} enumerator-${{ matrix.os }}-${{ matrix.arch }}
          else
            mv enumerator-${{ matrix.arch }} enumerator-${{ matrix.os }}-${{ matrix.arch }}
          fi

      - name: Upload release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            enumerator-linux-amd64
            enumerator-windows-amd64.exe
            enumerator-darwin-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
